{% extends 'hospital/base.html' %}

{% block title %}
Add Patient - IPCMS
{% endblock %}

{% block header %}
Add Patient
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Register New Patient</h2>

    <p class="description">
        Enter the patient's information below.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save Patient
        </button>

        <a href="{% url 'patient_list' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>

<style>

    .form-container {
        max-width: 700px;
    }

    .form-container h2 {
        margin-bottom: 8px;
    }

    .description {
        color: #607d8b;
        margin-bottom: 25px;
    }

    .form-container p {
        margin-bottom: 10px;
    }

    .form-container label {
        font-weight: bold;
    }

    .cancel-btn {
        display: inline-block;
        margin-left: 10px;
        padding: 10px 18px;
        color: #555;
        text-decoration: none;
    }

</style>

{% endblock %}
