{% extends 'hospital/base.html' %}

{% block title %}
Add Consultation - IPCMS
{% endblock %}

{% block header %}
Add Consultation
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>New Consultation</h2>

    <p class="description">
        Enter the patient's consultation details.
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Patient</label>

        <select name="patient" required>
            <option value="">Select Patient</option>

            {% for patient in patients %}
                <option value="{{ patient.id }}">
                    {{ patient.patient_id }} - {{ patient.name }}
                </option>
            {% endfor %}

        </select>


        <label>Doctor</label>

        <select name="doctor" required>
            <option value="">Select Doctor</option>

            {% for doctor in doctors %}
                <option value="{{ doctor.id }}">
                    {{ doctor }}
                </option>
            {% endfor %}

        </select>


        <label>Symptoms</label>

        <textarea
            name="symptoms"
            rows="4"
            placeholder="Enter patient's symptoms"
            required
        ></textarea>


        <label>Diagnosis</label>

        <textarea
            name="diagnosis"
            rows="4"
            placeholder="Enter diagnosis"
            required
        ></textarea>


        <label>Treatment</label>

        <textarea
            name="treatment"
            rows="4"
            placeholder="Enter recommended treatment"
            required
        ></textarea>


        <button type="submit" class="btn">
            Save Consultation
        </button>

        <a href="{% url 'consultation_list' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>


<style>

    .form-container {
        max-width: 700px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }

    .form-container h2 {
        margin-bottom: 8px;
    }

    .description {
        color: #607d8b;
        margin-bottom: 25px;
    }

    .form-container label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 6px;
    }

    .form-container select,
    .form-container textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
    }

    .form-container textarea {
        resize: vertical;
    }

    .btn {
        margin-top: 20px;
    }

    .cancel-btn {
        display: inline-block;
        margin-left: 10px;
        padding: 10px 18px;
        color: #555;
        text-decoration: none;
    }

</style>

{% endblock %}
