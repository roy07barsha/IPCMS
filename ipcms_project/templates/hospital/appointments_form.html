{% extends 'hospital/base.html' %}

{% block title %}
Book Appointment - IPCMS
{% endblock %}

{% block header %}
Book Appointment
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Book New Appointment</h2>

    <p class="description">
        Select a patient, doctor, date and time.
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Patient</label>

        <select name="patient" required>

            <option value="">Select Patient</option>

            {% for patient in patients %}

            <option value="{{ patient.id }}">
                {{ patient.patient_id }} - {{ patient.name }}
            </option>

            {% endfor %}

        </select>


        <label>Doctor</label>

        <select name="doctor" required>

            <option value="">Select Doctor</option>

            {% for doctor in doctors %}

            <option value="{{ doctor.id }}">
                {{ doctor }}
            </option>

            {% endfor %}

        </select>


        <label>Appointment Date</label>

        <input
            type="date"
            name="appointment_date"
            required
        >


        <label>Appointment Time</label>

        <input
            type="time"
            name="appointment_time"
            required
        >


        <button type="submit" class="btn">
            Book Appointment
        </button>

        <a href="{% url 'appointment_list' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>


<style>

    .form-container {
        max-width: 700px;
    }

    .form-container h2 {
        margin-bottom: 8px;
    }

    .description {
        color: #607d8b;
        margin-bottom: 25px;
    }

    .form-container label {
        display: block;
        font-weight: bold;
        margin-top: 12px;
    }

    .form-container select,
    .form-container input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .cancel-btn {
        display: inline-block;
        margin-left: 10px;
        padding: 10px 18px;
        color: #555;
        text-decoration: none;
    }

</style>

{% endblock %}
