{% extends 'hospital/base.html' %}

{% block title %}
Add Doctor - IPCMS
{% endblock %}

{% block header %}
Add Doctor
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Add New Doctor</h2>

    <p class="description">
        Enter the doctor's professional details.
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>User Account</label>

        <select name="user" required>
            <option value="">Select User</option>

            {% for user in users %}
                <option value="{{ user.id }}">
                    {{ user.get_full_name|default:user.username }}
                </option>
            {% endfor %}
        </select>


        <label>Specialization</label>

        <input
            type="text"
            name="specialization"
            placeholder="Example: Cardiologist"
            required
        >


        <label>Phone</label>

        <input
            type="text"
            name="phone"
            maxlength="15"
            placeholder="Enter phone number"
            required
        >


        <button type="submit" class="btn">
            Save Doctor
        </button>

        <a href="{% url 'doctor_list' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>


<style>

.form-container {
    max-width: 650px;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
}

.form-container h2 {
    margin-bottom: 8px;
}

.description {
    color: #607d8b;
    margin-bottom: 25px;
}

.form-container label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

.form-container select,
.form-container input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}

.btn {
    display: inline-block;
    margin-top: 22px;
    background: #1976d2;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
}

.cancel-btn {
    display: inline-block;
    margin-left: 10px;
    padding: 11px 18px;
    color: #555;
    text-decoration: none;
}

</style>

{% endblock %}
