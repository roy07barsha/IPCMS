{% extends 'hospital/base.html' %}

{% block title %}
Login - IPCMS
{% endblock %}

{% block header %}
Login
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Login to IPCMS</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Login
        </button>
    </form>

</div>

<style>
.form-container {
    max-width: 450px;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.form-container input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
}

.btn {
    margin-top: 15px;
    background: #1976d2;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 6px;
    cursor: pointer;
}
</style>

{% endblock %}
